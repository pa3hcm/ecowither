name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Monthly rebuild (1st of the month, 04:17 UTC) to pick up Alpine security patches
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_USERNAME: pa3hcm
  DOCKERHUB_IMAGE: docker.io/pa3hcm/ecowither

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # App version from src/ecowither.py and Alpine version from the Dockerfile,
      # for the Docker Hub tags users already know (e.g. v1.0 and v1.0-alpine3.24)
      - name: Read versions
        id: versions
        run: |
          app=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' src/ecowither.py)
          alpine=$(sed -n 's/^FROM alpine:\([0-9.]*\).*$/\1/p' Dockerfile)
          if [ -z "$app" ] || [ -z "$alpine" ]; then
            echo "::error::Could not read the app version ($app) or Alpine version ($alpine)"
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "alpine=$alpine" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub token
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::The DOCKERHUB_TOKEN secret is not set; it is needed to push to Docker Hub"
            exit 1
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.versions.outputs.app }},enable={{is_default_branch}}
            type=raw,value=${{ steps.versions.outputs.app }}-alpine${{ steps.versions.outputs.alpine }},enable={{is_default_branch}}
            type=sha,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          # Skip the layer cache on the monthly run, otherwise the apk upgrade layer is reused
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
